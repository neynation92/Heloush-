<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heloush Crochet — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2f3;color:#1b1719;font-family:Arial,sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#641b38,#c96b86)}.box{width:min(410px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 20px 60px #0004}.logo{display:block;width:85px;height:85px;border-radius:50%;object-fit:cover;margin:auto;border:3px solid #d5a12b}.box h1{font:700 27px Georgia;text-align:center;margin:14px 0 5px}.box p{text-align:center;color:#777;font-size:13px}.box input,.box button{width:100%;padding:13px;margin-top:9px;border:1px solid #ddd;border-radius:9px;font:inherit}.box button{background:#7d2141;color:#fff;border:0;font-weight:bold}.layout{display:none}.side{position:fixed;width:230px;inset:0 auto 0 0;background:#641b38;color:#fff;padding:22px}.side img{width:60px;height:60px;border-radius:50%;object-fit:cover}.side h2{font:700 21px Georgia;margin:8px 0}.side button{display:block;width:100%;background:transparent;color:#fff;border:0;text-align:left;padding:12px;border-radius:8px;margin-top:4px}.side button:hover{background:#fff2}.main{margin-left:230px;padding:28px;max-width:1200px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font:700 30px Georgia}.btn{padding:11px 14px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.logout{background:#fff;border:1px solid #ddd}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid #eadfe1;border-radius:14px;padding:20px;margin-top:16px}.stat b{font-size:27px}.stat span{display:block;color:#777;font-size:12px;margin-top:5px}.panel h2{font:700 21px Georgia;margin:0 0 15px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form input,.form select,.form textarea{padding:11px;border:1px solid #ddd;border-radius:8px;font:inherit}.form textarea,.form button{grid-column:1/-1}.submit{background:#7d2141;color:#fff}.items{display:grid;gap:8px}.item{display:grid;grid-template-columns:75px 1fr auto;gap:12px;align-items:center;border:1px solid #eee;padding:10px;border-radius:10px}.thumb{width:75px;height:60px;object-fit:cover;border-radius:7px;background:#f1e1e6}.item h3{margin:0 0 4px;font-size:14px}.item p{margin:0;color:#777;font-size:11px}.edit{background:#efd0d8}.del{background:#7d2141;color:#fff}.actions{display:flex;gap:6px}
@media(max-width:750px){.side{position:static;width:auto;display:flex;align-items:center;gap:12px;padding:12px}.side .navs{display:flex;overflow:auto}.side button{white-space:nowrap;width:auto}.side h2{display:none}.main{margin:0;padding:15px}.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.form textarea,.form button{grid-column:auto}.item{grid-template-columns:60px 1fr}.actions{grid-column:2}}
</style></head><body>
<div class="login" id="login"><div class="box"><img class="logo" src="../logo.svg"><h1>Heloush Crochet</h1><p>Espace administrateur</p><input id="email" placeholder="Identifiant"><input id="password" type="password" placeholder="Mot de passe"><button onclick="signIn()">Se connecter</button><p id="error"></p></div></div>
<div class="layout" id="app"><aside class="side"><img src="../logo.svg"><h2>Heloush</h2><div class="navs"><button onclick="document.getElementById('add').scrollIntoView()">➕ Ajouter</button><button onclick="document.getElementById('products').scrollIntoView()">🧶 Produits</button><button onclick="document.getElementById('formations').scrollIntoView()">🎓 Formations</button><button onclick="signOut()">Déconnexion</button></div></aside>
<main class="main"><div class="top"><div><h1>Tableau de bord</h1><p>Gestion de la boutique et des formations.</p></div></div>
<div class="stats"><div class="stat"><b id="pc">0</b><span>Produits</span></div><div class="stat"><b id="fc">0</b><span>Formations</span></div><div class="stat"><b>WhatsApp</b><span>Commandes et inscriptions</span></div></div>
<section class="panel" id="add"><h2>Ajouter / modifier</h2><form class="form" id="form"><select id="type"><option value="products">Produit</option><option value="formations">Formation</option></select><input id="name" required placeholder="Nom"><input id="price" required type="number" placeholder="Prix F CFA"><input id="category" placeholder="Catégorie"><input id="image" type="file" accept="image/*"><textarea id="desc" placeholder="Description"></textarea><button class="btn submit">Enregistrer</button></form></section>
<section class="panel" id="products"><h2>🧶 Produits</h2><div class="items" id="pl"></div></section>
<section class="panel" id="formations"><h2>🎓 Formations</h2><div class="items" id="fl"></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase.js"></script>
<script>
let edit=null;
async function signIn(){let u=email.value.trim(),p=password.value;let em=u==="admin"?"admin@heloush.local":u;let r=await supabaseClient.auth.signInWithPassword({email:em,password:p});if(r.error){error.textContent="Identifiant ou mot de passe incorrect.";return}show()}
async function show(){let s=await supabaseClient.auth.getSession();if(!s.data.session)return;login.style.display="none";app.style.display="block";load()}
async function signOut(){await supabaseClient.auth.signOut();location.reload()}
async function load(){let p=await supabaseClient.from("products").select("*").order("created_at",{ascending:false});let f=await supabaseClient.from("formations").select("*").order("created_at",{ascending:false});if(p.error||f.error){alert("Vérifie que le SQL Supabase a bien été exécuté.");return}render("products",p.data||[],"pl");render("formations",f.data||[],"fl");pc.textContent=(p.data||[]).length;fc.textContent=(f.data||[]).length}
function render(type,a,id){document.getElementById(id).innerHTML=a.map(x=>`<div class="item"><div>${x.image_url?`<img class="thumb" src="${x.image_url}">`:"🧶"}</div><div><h3>${x.name} — ${Number(x.price).toLocaleString("fr-FR")} F CFA</h3><p>${x.category||""} — ${x.description||""}</p></div><div class="actions"><button class="btn edit" onclick="editItem('${type}',${x.id})">Modifier</button><button class="btn del" onclick="removeItem('${type}',${x.id})">Supprimer</button></div></div>`).join("")||"<p>Aucun élément.</p>"}
async function upload(file){if(!file)return "";let ext=file.name.split(".").pop().toLowerCase(),path=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;let r=await supabaseClient.storage.from("heloush-images").upload(path,file,{upsert:false});if(r.error)throw r.error;return supabaseClient.storage.from("heloush-images").getPublicUrl(path).data.publicUrl}
async function editItem(type,id){let r=await supabaseClient.from(type).select("*").eq("id",id).single();let x=r.data;edit={type,id};document.getElementById("type").value=type;name.value=x.name;price.value=x.price;category.value=x.category||"";desc.value=x.description||"";document.getElementById("add").scrollIntoView({behavior:"smooth"})}
async function removeItem(type,id){if(!confirm("Supprimer cet élément ?"))return;let r=await supabaseClient.from(type).delete().eq("id",id);if(r.error)alert(r.error.message);else load()}
form.addEventListener("submit",async e=>{e.preventDefault();try{let file=image.files[0],url=await upload(file);let obj={name:name.value.trim(),price:Number(price.value),category:category.value.trim(),description:desc.value.trim()};if(url)obj.image_url=url;let r=edit?await supabaseClient.from(edit.type).update(obj).eq("id",edit.id):await supabaseClient.from(type.value).insert(obj);if(r.error)throw r.error;form.reset();edit=null;load()}catch(err){alert(err.message)}})
supabaseClient.auth.getSession().then(({data})=>data.session?show():null);
</script></body></html>
